# CircleCI configuration for npm-serverless-env-checker
# Configuration ID: 2025-08-13-fixed-v2
# This is a completely rewritten configuration to resolve stuck status issues

version: 2.1

# Define the base configuration
base_config: &base_config
  working_directory: ~/app/
  docker:
    - image: cimg/node:20.18
  resource_class: medium

jobs:
  # Unit testing with coverage
  unit-test:
    <<: *base_config
    steps:
      - checkout:
          path: ~/app
          fetch-depth: 1
          no-filters: true
      - run:
          name: Configure Git for HTTPS
          command: |
            git config --global url."https://github.com/".insteadOf git@github.com:
            git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - restore_cache:
          key: node_modules-{{ checksum "yarn.lock" }}
      - run:
          name: Setup Code Climate test-reporter
          command: |
            curl -L https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64 > ./cc-test-reporter
            chmod +x ./cc-test-reporter
      - run: NODE_ENV=development yarn
      - run: mkdir -p ./reports/jest/ ; true
      - run:
          name: Tests
          command: yarn test:ci --reporters=jest-junit --reporters=default --passWithNoTests
          environment:
            JEST_JUNIT_OUTPUT_DIR: ./reports/jest/
      - store_test_results:
          path: ./reports/jest/
      - run:
          name: Upload to CodeClimate
          command: |
            ./cc-test-reporter format-coverage -t=clover coverage/clover.xml
            ./cc-test-reporter upload-coverage
      - save_cache:
          key: node_modules-{{ checksum "yarn.lock" }}
          paths:
            - ~/app/node_modules/

  # Code quality checks
  lint:
    <<: *base_config
    steps:
      - checkout:
          path: ~/app
          fetch-depth: 1
          no-filters: true
      - run:
          name: Configure Git for HTTPS
          command: |
            git config --global url."https://github.com/".insteadOf git@github.com:
            git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - restore_cache:
          key: node_modules-{{ checksum "yarn.lock" }}
      - run: NODE_ENV=development yarn
      - run:
          name: Lint
          command: yarn lint
      - save_cache:
          key: node_modules-{{ checksum "yarn.lock" }}
          paths:
            - ~/app/node_modules/

  # TypeScript compilation check
  typescript:
    <<: *base_config
    steps:
      - checkout:
          path: ~/app
          fetch-depth: 1
          no-filters: true
      - run:
          name: Configure Git for HTTPS
          command: |
            git config --global url."https://github.com/".insteadOf git@github.com:
            git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - restore_cache:
          key: node_modules-{{ checksum "yarn.lock" }}
      - run: NODE_ENV=development yarn
      - run:
          name: Check typescript
          command: yarn ts
      - save_cache:
          key: node_modules-{{ checksum "yarn.lock" }}
          paths:
            - ~/app/node_modules/

  # Build verification
  build:
    <<: *base_config
    steps:
      - checkout:
          path: ~/app
          fetch-depth: 1
          no-filters: true
      - run:
          name: Configure Git for HTTPS
          command: |
            git config --global url."https://github.com/".insteadOf git@github.com:
            git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - restore_cache:
          key: node_modules-{{ checksum "yarn.lock" }}
      - run: NODE_ENV=development yarn
      - run:
          name: Yarn build
          command: yarn build
      - save_cache:
          key: node_modules-{{ checksum "yarn.lock" }}
          paths:
            - ~/app/node_modules/

# Define the workflow
workflows:
  version: 2
  application:
    jobs:
      - unit-test
      - lint
      - typescript
      - build
